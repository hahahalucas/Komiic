name: Build iPhone and iPad IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Unsigned needs your own signing before installation; signed requires configured real Apple secrets
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
      bundle_id:
        description: App bundle identifier (must match the supplied profile for signed builds)
        type: string
        default: com.example.Komiic
  push:
    branches:
      - main
      - komiic-ios-build
      - codex/komiic-3.0
      - codex/komiic-0.4.0
      - codex/komiic-0.5.0
      - codex/komiic-0.6.0
      - codex/komiic-0.7.0
      - codex/komiic-0.8.0
      - codex/komiic-0.9.0
      - codex/komiic-0.1.0
      - codex/komiic-1.0.1
      - codex/komiic-1.0.2-rebuild
      - codex/komiic-1.0.3
      - codex/komiic-1.0.4
      - codex/komiic-1.0.5

permissions:
  contents: read

concurrency:
  group: komiic-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    if: ${{ !contains(fromJSON('["codex/komiic-1.0.2-rebuild", "codex/komiic-1.0.3", "codex/komiic-1.0.4", "codex/komiic-1.0.5"]'), github.ref_name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Inspect public first-party collection contracts
        run: python3 scripts/inspect_collections_api.py
      - name: Verify combined detail query and public image loading
        run: python3 scripts/verify_loading_api.py --output build/loading-api.json
      - name: Upload loading verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-loading-api-${{ github.run_number }}
          path: build/loading-api.json
          if-no-files-found: warn
          retention-days: 7
  build:
    name: ${{ matrix.mode == 'ipa' && 'Device IPA only' || 'Full iPhone and iPad verification' }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.mode == 'ipa' && 20 || 40 }}
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(contains(fromJSON('["codex/komiic-1.0.2-rebuild", "codex/komiic-1.0.3", "codex/komiic-1.0.4", "codex/komiic-1.0.5"]'), github.ref_name) && '["ipa"]' || '["ipa", "full"]') }}
    env:
      KOMIIC_BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.Komiic' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Apple build tools
        if: github.ref_name != 'codex/komiic-1.0.5'
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Decode live public comments with the app API
        if: matrix.mode == 'full'
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/KomiicCommentCheck.swift" <<'SWIFT'
          @main
          enum KomiicCommentCheck {
              enum ProbeError: Error { case emptyPage(ComicContentMode) }

              static func main() async throws {
                  for (mode, comicID) in [(ComicContentMode.general, "4632"), (.adult, "11521")] {
                      let page = try await KomiicAPI(mode: mode).comicComments(comicID: comicID, offset: 0)
                      guard !page.comments.isEmpty else { throw ProbeError.emptyPage(mode) }
                      let textAvatars = page.comments.filter { $0.account?.profileImageUrl?.url == nil }.count
                      print("\(mode.rawValue): decoded \(page.comments.count) public comments, \(textAvatars) with text avatars")
                  }
              }
          }
          SWIFT
          xcrun swiftc -swift-version 5 -parse-as-library \
            Komiic/Core/AccountModels.swift Komiic/Core/Models.swift Komiic/Core/KomiicAPI.swift \
            Komiic/Core/OfficialCommentsAPI.swift Komiic/Core/SessionCookieStore.swift \
            "$RUNNER_TEMP/KomiicCommentCheck.swift" -o "$RUNNER_TEMP/komiic-comment-check"
          "$RUNNER_TEMP/komiic-comment-check" | tee "$RUNNER_TEMP/komiic-comment-api.log"

      - name: Run build script
        id: package
        env:
          BUILD_MODE: ${{ matrix.mode }}
          SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          arguments=("--$SIGNING_MODE")
          if [[ "$GITHUB_REF_NAME" == "codex/komiic-1.0.5" ]]; then
            arguments+=(--package-only)
          elif [[ "$BUILD_MODE" == "ipa" ]]; then
            arguments+=(--skip-tests)
          fi
          bash scripts/build_ipa.sh "${arguments[@]}"

      - name: Upload installation IPA only
        if: matrix.mode == 'ipa'
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-IPA-${{ github.run_number }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Archive build source
        if: matrix.mode == 'full'
        env:
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_dir }}
        run: |
          git archive --format=zip --prefix=Komiic/ --output="$ARTIFACT_DIRECTORY/Komiic-source.zip" HEAD
          cp "$RUNNER_TEMP/komiic-comment-api.log" "$ARTIFACT_DIRECTORY/comment-api.log"

      - name: Upload source, IPA, tests, screenshots and logs
        if: always() && matrix.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-full-verification-${{ github.run_number }}
          path: build/ipa.*/artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Describe installation status
        if: success()
        env:
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_dir }}
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          cat "$ARTIFACT_DIRECTORY/INSTALLATION.txt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_MODE" == "full" ]]; then
            printf '\nIncludes source, iPhone and iPad simulator screenshots, XCTest results, a device-code verification report, and SHA-256.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
