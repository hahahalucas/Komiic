name: Build Komiic 2.0 device IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Unsigned needs your own signing before installation; signed requires configured real Apple secrets
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
      bundle_id:
        description: App bundle identifier (must match the supplied profile for signed builds)
        type: string
        default: com.example.Komiic
  push:
    branches:
      - codex/komiic-2.0-device

permissions:
  contents: read

concurrency:
  group: komiic-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Package and verify iPhone and iPad device IPA
    runs-on: macos-26
    timeout-minutes: 20
    env:
      KOMIIC_BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.Komiic' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build and verify real device IPA without repeating simulator tests
        id: package
        env:
          SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [[ "$SIGNING_MODE" == "signed" ]]; then
            bash scripts/build_ipa.sh --signed --skip-tests
          else
            bash scripts/build_ipa.sh --unsigned --skip-tests
          fi

      - name: Upload IPA, verification and device build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-iPhone-iPad-${{ inputs.signing || 'unsigned' }}-${{ github.run_number }}
          path: build/ipa.*/artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Describe installation status
        if: success()
        env:
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_dir }}
        run: |
          cat "$ARTIFACT_DIRECTORY/INSTALLATION.txt" >> "$GITHUB_STEP_SUMMARY"
          printf '\nIncludes device IPA, device-code verification report, build log, and SHA-256. Simulator tests and screenshots run separately: https://github.com/hahahalucas/Komiic/actions/runs/44989974389\n' >> "$GITHUB_STEP_SUMMARY"
