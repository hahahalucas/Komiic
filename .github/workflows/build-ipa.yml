name: Build iPhone and iPad IPA

on:
  workflow_dispatch:
    inputs:
      signing:
        description: Unsigned needs your own signing before installation; signed requires configured real Apple secrets
        type: choice
        options:
          - unsigned
          - signed
        default: unsigned
      bundle_id:
        description: App bundle identifier (must match the supplied profile for signed builds)
        type: string
        default: com.example.Komiic
  push:
    branches:
      - main
      - komiic-ios-build
      - codex/komiic-3.0
      - codex/komiic-0.4.0
      - codex/komiic-0.5.0
      - codex/komiic-0.6.0
      - codex/komiic-0.7.0
      - codex/komiic-0.8.0
      - codex/komiic-0.9.0
      - codex/komiic-0.1.0

permissions:
  contents: read

concurrency:
  group: komiic-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Inspect public first-party collection contracts
        run: python3 scripts/inspect_collections_api.py
      - name: Verify combined detail query and public image loading
        run: python3 scripts/verify_loading_api.py --output build/loading-api.json
      - name: Upload loading verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-loading-api-${{ github.run_number }}
          path: build/loading-api.json
          if-no-files-found: warn
          retention-days: 7
  build:
    name: ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: ipa
            name: Device IPA only
            timeout: 20
          - mode: full
            name: Full iPhone and iPad verification
            timeout: 40
    env:
      KOMIIC_BUNDLE_ID: ${{ inputs.bundle_id || 'com.example.Komiic' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify Apple build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Run build script
        id: package
        env:
          BUILD_MODE: ${{ matrix.mode }}
          SIGNING_MODE: ${{ inputs.signing || 'unsigned' }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          arguments=("--$SIGNING_MODE")
          if [[ "$BUILD_MODE" == "ipa" ]]; then
            arguments+=(--skip-tests)
          fi
          bash scripts/build_ipa.sh "${arguments[@]}"

      - name: Upload installation IPA only
        if: matrix.mode == 'ipa'
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-IPA-${{ github.run_number }}
          path: ${{ steps.package.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Archive build source
        if: matrix.mode == 'full'
        env:
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_dir }}
        run: git archive --format=zip --prefix=Komiic/ --output="$ARTIFACT_DIRECTORY/Komiic-source.zip" HEAD

      - name: Upload source, IPA, tests, screenshots and logs
        if: always() && matrix.mode == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: Komiic-full-verification-${{ github.run_number }}
          path: build/ipa.*/artifacts/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Describe installation status
        if: success()
        env:
          ARTIFACT_DIRECTORY: ${{ steps.package.outputs.artifact_dir }}
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          cat "$ARTIFACT_DIRECTORY/INSTALLATION.txt" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$BUILD_MODE" == "full" ]]; then
            printf '\nIncludes source, iPhone and iPad simulator screenshots, XCTest results, a device-code verification report, and SHA-256.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
